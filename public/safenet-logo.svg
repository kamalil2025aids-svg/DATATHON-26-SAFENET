<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050816"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="100%" style="stop-color:#22D3EE"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Grid Pattern (Smart City) -->
  <g opacity="0.08" stroke="#00E5FF" stroke-width="1" fill="none">
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="120" y1="120" x2="392" y2="120"/>
    <line x1="120" y1="392" x2="392" y2="392"/>
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="352" x2="432" y2="352"/>
    <line x1="160" y1="80" x2="160" y2="432"/>
    <line x1="352" y1="80" x2="352" y2="432"/>
  </g>

  <!-- Outermost Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" opacity="0.15"/>

  <!-- Shield Background -->
  <path d="M256 86 L376 140 L376 256 C376 340 320 396 256 426 C192 396 136 340 136 256 L136 140 Z" 
        fill="url(#shieldGrad)" stroke="url(#cyanGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Shield Inner Border -->
  <path d="M256 104 L358 152 L358 250 C358 326 308 378 256 404 C204 378 154 326 154 250 L154 152 Z" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Checkmark inside Shield -->
  <g filter="url(#softGlow)">
    <path d="M210 260 L245 295 L302 225" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Central Dot (AI Core) -->
  <circle cx="256" cy="256" r="6" fill="#00E5FF" filter="url(#glow)" opacity="0.6"/>

  <!-- Orbiting Rings (AI signals) -->
  <ellipse cx="256" cy="256" rx="90" ry="30" fill="none" stroke="url(#cyanGrad)" stroke-width="1.2" opacity="0.25" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="90" ry="30" fill="none" stroke="url(#cyanGrad)" stroke-width="1.2" opacity="0.25" transform="rotate(30 256 256)"/>

  <!-- Orbital Dots -->
  <circle cx="315" cy="181" r="3.5" fill="#00E5FF" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="192" cy="320" r="3" fill="#22D3EE" opacity="0.4" filter="url(#softGlow)"/>

  <!-- Radar Arc -->
  <path d="M256 256 L376 140" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <path d="M256 256 L136 140" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

  <!-- Small City Building indicators -->
  <g fill="url(#cyanGrad)" opacity="0.3">
    <rect x="140" y="370" width="8" height="20" rx="1"/>
    <rect x="154" y="358" width="8" height="32" rx="1"/>
    <rect x="168" y="365" width="8" height="25" rx="1"/>
    <rect x="336" y="358" width="8" height="32" rx="1"/>
    <rect x="350" y="368" width="8" height="22" rx="1"/>
    <rect x="364" y="360" width="8" height="30" rx="1"/>
  </g>

  <!-- Connection lines from central dot to city buildings -->
  <g stroke="url(#cyanGrad)" stroke-width="0.8" opacity="0.15" fill="none">
    <line x1="256" y1="370" x2="144" y2="380"/>
    <line x1="256" y1="370" x2="158" y2="375"/>
    <line x1="256" y1="370" x2="172" y2="380"/>
    <line x1="256" y1="370" x2="340" y2="378"/>
    <line x1="256" y1="370" x2="354" y2="380"/>
    <line x1="256" y1="370" x2="368" y2="378"/>
  </g>

  <!-- External ring segments -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.1" stroke-dasharray="8 12"/>
</svg>


services:
  - type: web
    name: safenet-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safenet-db
          property: connectionString
      - key: REDIS_URL
        value: redis://red-cr9m5nqj1k6c73bgo7sg:6379
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "[\"https://safenet-app.vercel.app\", \"http://localhost:5173\"]"
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: safenet-db
    databaseName: safenet
    user: safenet_user
    plan: free


services:
  - type: web
    name: safenet-backend
    env: python
    sourceDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safenet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "[\"https://safenet-app-one.vercel.app\", \"http://localhost:5173\", \"http://localhost:3000\", \"http://localhost:8000\"]"
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: safenet-db
    databaseName: safenet
    user: safenet_user
    plan: free


services:
  - type: web
    name: safenet-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && bash start.sh
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safenet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "[\"https://datathon-26-safenet-376u.vercel.app\", \"https://safenet-app-one.vercel.app\", \"http://localhost:5173\", \"http://localhost:3000\", \"http://localhost:8000\"]"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: REDIS_URL
        value: ""

databases:
  - name: safenet-db
    databaseName: safenet
    user: safenet_user
    plan: free

